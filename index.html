<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글자취미 — 언리미티드 에디션 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Song+Myung&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
  body{ height:100dvh; overflow:hidden; -webkit-user-select:none; user-select:none; }
  .app{
    height:100dvh;
    display:flex; flex-direction:column; gap:var(--gap);
    padding:var(--gap) clamp(8px,2.4vw,16px);
    padding-bottom:max(var(--gap), env(safe-area-inset-bottom));
  }

  /* ── 헤더 ───────────────────────────── */
  header{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 2px; min-width:0; }
  header .brand{ flex:0 0 auto; }
  .fair{
    flex:0 1 auto; min-width:0; overflow:hidden;
    font-family:"IBM Plex Mono", monospace;
    font-size:clamp(8px,1.15vh,10px); letter-spacing:.16em;
    color:var(--ink-2); border:1px solid var(--line-2);
    border-radius:4px; padding:2px 5px; white-space:nowrap;
  }
  /* 좁은 화면에서는 재고 버튼이 먼저입니다 — 장식은 숨깁니다. */
  @media (max-width:430px){ .fair{ display:none; } }
  .today{
    flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
    margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:clamp(10px,1.45vh,12px); color:var(--ink-2); white-space:nowrap;
  }
  .today b{ color:var(--ink); font-weight:600; }
  .stock-btn{
    flex:0 0 auto;
    padding:6px 11px; border:1px solid var(--line);
    border-radius:9px; background:var(--surface); color:var(--ink);
    font:inherit; font-size:clamp(10px,1.45vh,12px); font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  .stock-btn:active{ background:var(--surface-2); }
  .stock-btn .warn{ color:var(--t2); font-weight:700; }

  /* ── 버튼판 ─────────────────────────── */
  .board{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:var(--gap); }
  .group{ display:flex; flex-direction:column; gap:calc(var(--gap) * .8); min-height:0; }
  .group.singles{ flex:5 1 0; }
  .group.sets{ flex:1.3 1 0; }
  .group-bar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 2px; }
  .group-name{
    font-size:clamp(11px,1.5vh,13px); font-weight:600;
    letter-spacing:.06em; color:var(--accent);
    display:flex; align-items:center; gap:6px;
  }
  .group-name::before{ content:""; width:9px; height:9px; border-radius:2px; background:var(--accent); }
  .group-sub{
    margin-left:auto;
    font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
    font-size:clamp(11px,1.5vh,13px); color:var(--ink-2);
  }
  .group-sub b{ color:var(--ink); font-weight:600; }

  .grid{
    flex:1 1 auto; min-height:0;
    display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
    grid-auto-rows:minmax(0,1fr); gap:var(--gap);
  }

  /* ── 상품 타일 ──────────────────────── */
  .item{
    position:relative;
    display:flex; flex-direction:column; justify-content:center; gap:2px;
    padding:clamp(6px,1.2vh,12px) clamp(8px,2vw,14px);
    border:1px solid var(--line); border-radius:var(--r);
    background:var(--surface); color:var(--ink);
    box-shadow:var(--shadow);
    font:inherit; text-align:left; cursor:pointer;
    transition:transform .09s ease, background-color .12s ease, border-color .12s ease;
    overflow:hidden;
  }
  .item:active{ transform:scale(.975); }
  .item:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .item .nm{ font-size:clamp(12px,1.85vh,16px); font-weight:500; line-height:1.25; }
  .item .pr{
    font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
    font-size:clamp(11px,1.6vh,14px); font-weight:500; color:var(--ink-2);
  }
  .grid .item:last-child:nth-child(even){ grid-column:span 2; }

  .item.big{ grid-column:span 2; background:var(--soft); border-color:var(--line-accent); }
  .item.big .nm{ font-size:clamp(15px,2.5vh,21px); font-weight:700; }
  .item.big .pr{ font-size:clamp(12px,1.8vh,15px); color:var(--accent); }

  /* 남은 재고 뱃지 */
  .item .left{
    position:absolute; bottom:6px; right:10px;
    font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
    font-size:clamp(9px,1.3vh,11px); color:var(--ink-2); opacity:.75;
  }
  .item.low .left{ color:var(--t2); opacity:1; font-weight:600; }
  .item.out{ opacity:.55; }
  .item.out .left{ color:var(--t2); opacity:1; font-weight:700; }

  .item.on{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .item.on .pr{ color:var(--on-accent); opacity:.75; }
  .item.on .left{ display:none; }
  .item.on .minus{ display:flex; }
  .item.on .qty{ display:flex; }

  .qty{
    position:absolute; top:0; right:0;
    min-width:clamp(26px,4.4vh,34px); height:clamp(22px,3.4vh,28px); padding:0 8px;
    display:none; align-items:center; justify-content:center;
    border-bottom-left-radius:12px;
    background:var(--on-accent); color:var(--accent);
    font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
    font-size:clamp(12px,1.9vh,15px); font-weight:600;
  }
  .minus{
    position:absolute; bottom:0; right:0;
    width:clamp(34px,5.4vh,44px); height:clamp(30px,4.6vh,38px);
    display:none; align-items:center; justify-content:center;
    border:0; border-top-left-radius:12px;
    background:rgba(255,255,255,.16); color:var(--on-accent);
    font-size:clamp(15px,2.2vh,19px); line-height:1; cursor:pointer;
  }
  .minus:active{ background:rgba(255,255,255,.3); }
  .minus:focus-visible{ outline:2px solid var(--on-accent); outline-offset:-4px; }

  /* ── 합계바 ─────────────────────────── */
  .total{
    flex:0 0 auto; display:flex; flex-direction:column; gap:clamp(4px,.8vh,8px);
    padding:clamp(8px,1.4vh,14px) clamp(12px,3vw,18px) clamp(9px,1.4vh,14px);
    border-radius:var(--r); background:var(--ink); color:var(--paper);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .total-top{ display:flex; align-items:center; gap:10px; }
  .total-top .cnt{ font-size:clamp(10px,1.5vh,13px); opacity:.6; min-width:0; overflow:hidden; white-space:nowrap; }
  .acts{ margin-left:auto; display:flex; gap:8px; }
  .acts button{
    min-width:clamp(52px,13.5vw,74px); padding:clamp(8px,1.5vh,12px) 10px;
    border-radius:10px; border:1px solid rgba(255,255,255,.22);
    background:transparent; color:var(--paper);
    font:inherit; font-size:clamp(11px,1.6vh,13px); font-weight:500; cursor:pointer;
  }
  .acts button:active{ background:rgba(255,255,255,.14); }
  .acts button:disabled{ opacity:.3; cursor:default; }
  #reset.armed{ background:var(--t2); border-color:var(--t2); color:#fff; }

  .sum{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .sum .n{
    font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
    font-size:clamp(25px, min(5.4vh,11vw), 46px);
    font-weight:600; line-height:1; letter-spacing:-.02em;
  }
  .sum .won{ font-family:"Song Myung", serif; font-size:clamp(14px,2.2vh,20px); opacity:.7; }

  .sale-row{ display:flex; gap:8px; }
  .sale{
    flex:1 1 0; min-width:0; min-height:clamp(42px,6.2vh,56px);
    border:0; border-radius:10px; background:var(--paper); color:var(--ink);
    font:inherit; font-size:clamp(14px,2.1vh,17px); font-weight:700;
    letter-spacing:.02em; cursor:pointer; transition:transform .09s ease, opacity .12s ease;
  }
  .sale:active{ transform:scale(.99); }
  .sale:disabled{ opacity:.25; cursor:default; }

  /* ── 재고 시트 ──────────────────────── */
  .scrim{
    position:fixed; inset:0; z-index:20;
    background:rgba(10,12,16,.45);
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    max-height:92dvh; display:flex; flex-direction:column;
    background:var(--paper);
    border-top-left-radius:18px; border-top-right-radius:18px;
    box-shadow:0 -8px 40px rgba(0,0,0,.3);
    transform:translateY(102%); transition:transform .22s cubic-bezier(.3,.8,.4,1);
    -webkit-user-select:text; user-select:text;
  }
  .sheet.open{ transform:translateY(0); }
  @media (min-width:760px){
    .sheet{ left:50%; right:auto; width:720px; transform:translate(-50%,102%); }
    .sheet.open{ transform:translate(-50%,0); }
  }
  .sheet-top{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:14px clamp(12px,3.5vw,20px) 10px;
    border-bottom:1px solid var(--line);
  }
  .sheet-top h2{ margin:0; font-family:"Song Myung", serif; font-size:17px; font-weight:400; }
  .close{
    margin-left:auto; padding:8px 13px; border:1px solid var(--line);
    border-radius:9px; background:var(--surface); color:var(--ink);
    font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  .sheet-body{ flex:1 1 auto; overflow-y:auto; padding:0 clamp(12px,3.5vw,20px) 28px; -webkit-overflow-scrolling:touch; }

  .hint{ margin:12px 0 10px; font-size:12px; line-height:1.65; color:var(--ink-2); }

  table.stock{ width:100%; border-collapse:collapse; }
  table.stock th, table.stock td{
    padding:8px 6px; border-bottom:1px solid var(--line);
    font-size:13px; text-align:right; vertical-align:middle;
  }
  table.stock th{
    position:sticky; top:0; z-index:1; background:var(--paper);
    font-size:11px; font-weight:600; color:var(--ink-2); letter-spacing:.04em;
    border-bottom:1px solid var(--line-2);
  }
  table.stock th:first-child, table.stock td:first-child{ text-align:left; }
  table.stock td.nm{ font-weight:500; }
  table.stock td.nm small{ display:block; font-size:11px; color:var(--ink-2); font-weight:400; }
  table.stock input{
    width:62px; padding:7px 8px; text-align:right;
    border:1px solid var(--line-2); border-radius:8px;
    background:var(--surface); color:var(--ink);
    font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
    font-size:14px; font-weight:600;
  }
  table.stock input:focus{ outline:2px solid var(--t1); outline-offset:0; border-color:var(--t1); }
  td.left-cell{
    font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
    font-size:16px; font-weight:700;
  }
  td.left-cell.low{ color:var(--t2); }
  td.left-cell.none{ color:var(--ink-2); font-weight:400; }
  tfoot td{ font-weight:600; border-bottom:0; }

  .sum-cards{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:14px 0 4px; }
  .card{ padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  .card .k{ font-size:11px; color:var(--ink-2); }
  .card .v{
    font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
    font-size:18px; font-weight:600; margin-top:2px;
  }

  h3.sec{ margin:20px 0 8px; font-size:13px; font-weight:600; color:var(--ink-2); letter-spacing:.04em; }
  .rec{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface); margin-bottom:6px;
  }
  .rec .t{ font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-2); }
  .rec .ln{ flex:1 1 auto; min-width:0; font-size:12.5px; line-height:1.4; }
  .rec .amt{ font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; font-size:14px; font-weight:600; }
  .rec .pay{ font-size:11px; padding:2px 7px; border-radius:999px; background:var(--pay-cash-bg); color:var(--pay-cash-fg); white-space:nowrap; }
  /* nc = 현금이 아닌 결제 (카드) */
  .rec .pay.nc{ background:var(--pay-tr-bg); color:var(--pay-tr-fg); }
  .rec .del{
    flex:0 0 auto; width:30px; height:30px; border:1px solid var(--line);
    border-radius:8px; background:var(--surface); color:var(--ink-2);
    font:inherit; font-size:15px; line-height:1; cursor:pointer;
  }
  .rec .del:active{ background:var(--t2); border-color:var(--t2); color:#fff; }
  .empty{ padding:18px 0; text-align:center; font-size:13px; color:var(--ink-2); }

  /* ── 토스트 ─────────────────────────── */
  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22vh);
    transform:translate(-50%,8px); padding:12px 20px; border-radius:999px;
    background:var(--ink); color:var(--paper);
    font-size:14px; font-weight:600; white-space:nowrap;
    box-shadow:0 6px 24px rgba(0,0,0,.28);
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    z-index:30;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .total{ background:#EDEFF3; color:#15171C; }
    :root:not([data-theme="light"]) .acts button{ border-color:rgba(21,23,28,.2); color:#15171C; }
    :root:not([data-theme="light"]) .acts button:active{ background:rgba(21,23,28,.08); }
    :root:not([data-theme="light"]) #reset.armed{ background:#B03A2E; border-color:#B03A2E; color:#fff; }
    :root:not([data-theme="light"]) .sale{ background:#15171C; color:#EDEFF3; }
    :root:not([data-theme="light"]) .toast{ background:#EDEFF3; color:#15171C; }
  }
  :root[data-theme="dark"] .total{ background:#EDEFF3; color:#15171C; }
  :root[data-theme="dark"] .acts button{ border-color:rgba(21,23,28,.2); color:#15171C; }
  :root[data-theme="dark"] #reset.armed{ background:#B03A2E; border-color:#B03A2E; color:#fff; }
  :root[data-theme="dark"] .sale{ background:#15171C; color:#EDEFF3; }
  :root[data-theme="dark"] .toast{ background:#EDEFF3; color:#15171C; }

  @media (min-width:900px){ .app{ max-width:1100px; margin:0 auto; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="brand">글자취미</span>
    <span class="fair">UNLIMITED EDITION</span>
    <span class="today">오늘 <b id="todayAmt">0</b>원 · <b id="todayCnt">0</b>건</span>
    <button class="stock-btn" id="openStock" type="button">재고</button>
  </header>

  <main class="board" id="board"></main>

  <div class="total">
    <div class="total-top">
      <span class="cnt" id="cnt">담긴 상품 없음</span>
      <div class="acts">
        <button id="undo" type="button" disabled>되돌리기</button>
        <button id="reset" type="button" disabled>초기화</button>
      </div>
    </div>
    <div class="sum"><span class="n" id="sum">0</span><span class="won">원</span></div>
    <div class="sale-row">
      <button class="sale" id="saleCash" type="button" disabled>현금</button>
      <button class="sale" id="saleCard" type="button" disabled>카드</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true" aria-label="재고와 판매 기록">
  <div class="sheet-top">
    <h2>재고 · 판매</h2>
    <button class="close" id="closeStock" type="button">닫기</button>
  </div>
  <div class="sheet-body">
    <div class="sum-cards">
      <div class="card"><div class="k">총 매출</div><div class="v" id="sAmt">0</div></div>
      <div class="card"><div class="k">판매 건수</div><div class="v" id="sCnt">0</div></div>
      <div class="card"><div class="k">현금 / 카드</div><div class="v" id="sPay">0 / 0</div></div>
    </div>

    <p class="hint">
      <b>총 재고</b>는 직접 넣으세요. <b>판매</b>는 버튼을 누를 때마다 자동으로 올라가고,
      손으로 고치면 그만큼 보정됩니다(행사 전에 이미 나간 수량 등). <b>남은 재고</b>는 둘의 차이입니다.
      세트가 팔리면 구성 단품이 각각 하나씩 빠집니다.
    </p>

    <table class="stock">
      <thead>
        <tr><th>상품</th><th>총 재고</th><th>판매</th><th>남은 재고</th></tr>
      </thead>
      <tbody id="stockBody"></tbody>
      <tfoot id="stockFoot"></tfoot>
    </table>

    <h3 class="sec">판매 기록</h3>
    <div id="recs"></div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/ue-catalog.js"></script>
<script src="assets/ue-store.js"></script>
<script>
(function(){
  const CART_KEY = 'ue-cart-v1';
  let cart = {}, history = [];

  try {
    const raw = localStorage.getItem(CART_KEY);
    if (raw){ const s = JSON.parse(raw); if (s && s.cart){ cart = s.cart; history = s.history || []; } }
  } catch(e){}
  function saveCart(){
    try { localStorage.setItem(CART_KEY, JSON.stringify({cart, history})); } catch(e){}
  }

  /* ── 버튼판 그리기 ──────────────────── */
  const board = document.getElementById('board');
  UE_GROUPS.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'group ' + (g.key === 'set' ? 'sets' : 'singles');
    sec.style.setProperty('--accent', 'var(--' + g.accent + ')');
    sec.style.setProperty('--soft', 'var(--' + g.accent + '-soft)');
    sec.style.setProperty('--line-accent', 'var(--' + g.accent + '-line)');
    sec.innerHTML =
      '<div class="group-bar">' +
        '<span class="group-name">' + g.name + '</span>' +
        '<span class="group-sub" id="sub-' + g.key + '">0<span style="opacity:.6">원</span></span>' +
      '</div><div class="grid"></div>';
    const grid = sec.querySelector('.grid');

    g.items.forEach(it => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'item' + (it.big ? ' big' : '');
      b.dataset.id = it.id;
      b.innerHTML =
        '<span class="qty" data-qty></span>' +
        '<span class="nm">' + it.nm + '</span>' +
        '<span class="pr">' + won(it.pr) + '원</span>' +
        '<span class="left" data-left></span>' +
        '<span class="minus" role="button" tabindex="0" aria-label="' + it.nm + ' 하나 빼기">&minus;</span>';
      b.addEventListener('click', e => {
        if (e.target.closest('.minus')) return;
        add(it.id, 1);
      });
      const m = b.querySelector('.minus');
      m.addEventListener('click', e => { e.stopPropagation(); add(it.id, -1); });
      m.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); add(it.id, -1); }
      });
      grid.appendChild(b);
    });
    board.appendChild(sec);
  });

  function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

  function add(id, d){
    const next = (cart[id] || 0) + d;
    if (next < 0) return;
    if (next === 0) delete cart[id]; else cart[id] = next;
    history.push({ id, d });
    if (history.length > 200) history.shift();
    buzz(d > 0 ? 12 : 8);
    render();
  }

  const sumEl = document.getElementById('sum');
  const cntEl = document.getElementById('cnt');
  const undoBtn = document.getElementById('undo');
  const resetBtn = document.getElementById('reset');
  const saleCash = document.getElementById('saleCash');
  const saleCard = document.getElementById('saleCard');
  const toastEl = document.getElementById('toast');
  const stockBtn = document.getElementById('openStock');

  let currentTotal = 0;

  /* 장바구니에 담긴 것까지 미리 빼서 본 남은 재고 */
  function leftMap(){
    const out = {};
    Store.stockRows().forEach(r => { out[r.id] = r.left; });
    Object.keys(cart).forEach(id => {
      const parts = partsOf(id, cart[id]);
      Object.keys(parts).forEach(p => {
        if (out[p] !== null && out[p] !== undefined) out[p] -= parts[p];
      });
    });
    return out;
  }

  function render(){
    let total = 0, count = 0;
    const per = { single:0, set:0 };
    const left = leftMap();

    document.querySelectorAll('.item').forEach(el => {
      const id = el.dataset.id, q = cart[id] || 0, it = CATALOG[id];
      el.classList.toggle('on', q > 0);
      el.querySelector('[data-qty]').textContent = q > 0 ? '×' + q : '';

      /* 이 상품을 하나 더 팔 때 가장 모자란 구성품의 잔량 */
      const parts = partsOf(id, 1);
      let min = null;
      Object.keys(parts).forEach(p => {
        if (left[p] === null || left[p] === undefined) return;
        min = (min === null) ? left[p] : Math.min(min, left[p]);
      });
      const lf = el.querySelector('[data-left]');
      lf.textContent = min === null ? '' : (min <= 0 ? '품절' : '남 ' + min);
      el.classList.toggle('out', min !== null && min <= 0);
      el.classList.toggle('low', min !== null && min > 0 && min <= 3);

      el.setAttribute('aria-label', it.nm + ' ' + won(it.pr) + '원, ' + q + '개 담김' +
        (min === null ? '' : ', 남은 재고 ' + min));
    });

    Object.keys(cart).forEach(id => {
      const it = CATALOG[id]; if (!it) return;
      const amt = it.pr * cart[id];
      total += amt; count += cart[id];
      per[it.group] += amt;
    });

    currentTotal = total;
    sumEl.textContent = won(total);
    cntEl.textContent = count === 0 ? '담긴 상품 없음' : '담긴 상품 ' + count + '개';

    UE_GROUPS.forEach(g => {
      document.getElementById('sub-' + g.key).innerHTML =
        '<b>' + won(per[g.key]) + '</b><span style="opacity:.6">원</span>';
    });

    undoBtn.disabled = history.length === 0;
    resetBtn.disabled = count === 0;
    saleCash.disabled = count === 0;
    saleCard.disabled = count === 0;
    if (count === 0) disarm();

    /* 재고 버튼에 품절·임박 표시 */
    const rows = Store.stockRows();
    const outCnt = rows.filter(r => r.left !== null && r.left <= 0).length;
    const lowCnt = rows.filter(r => r.left !== null && r.left > 0 && r.left <= 3).length;
    stockBtn.innerHTML = outCnt ? '재고 <span class="warn">품절 ' + outCnt + '</span>'
                       : lowCnt ? '재고 <span class="warn">임박 ' + lowCnt + '</span>'
                       : '재고';

    saveCart();
  }

  function refreshToday(){
    const s = Store.todaySummary();
    document.getElementById('todayAmt').textContent = won(s.total);
    document.getElementById('todayCnt').textContent = s.sales;
  }

  let toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
  }

  undoBtn.addEventListener('click', () => {
    const last = history.pop();
    if (!last) return;
    const next = (cart[last.id] || 0) - last.d;
    if (next <= 0) delete cart[last.id]; else cart[last.id] = next;
    buzz(8); render();
  });

  function completeSale(pay){
    const lines = Object.keys(cart).map(id => ({ id, qty: cart[id] }));
    if (!lines.length) return;
    const amount = currentTotal;
    const rec = Store.add(lines, pay);
    if (!rec){ toast('저장 실패 — 브라우저 저장공간을 확인해 주세요'); return; }
    cart = {}; history = [];
    disarm(); buzz(24); render(); refreshToday();
    if (sheet.classList.contains('open')) paintSheet();
    toast(Store.payLabel(pay) + ' · ' + won(amount) + '원 저장');
  }
  saleCash.addEventListener('click', () => completeSale('cash'));
  saleCard.addEventListener('click', () => completeSale('card'));

  let armed = false, armTimer = null;
  function disarm(){
    armed = false; clearTimeout(armTimer);
    resetBtn.classList.remove('armed'); resetBtn.textContent = '초기화';
  }
  resetBtn.addEventListener('click', () => {
    if (!armed){
      armed = true;
      resetBtn.classList.add('armed');
      resetBtn.textContent = '한 번 더';
      armTimer = setTimeout(disarm, 2500);
      return;
    }
    cart = {}; history = []; disarm(); buzz(20); render();
  });

  /* ── 재고 시트 ──────────────────────── */
  const scrim = document.getElementById('scrim');
  const sheet = document.getElementById('sheet');
  const stockBody = document.getElementById('stockBody');
  const stockFoot = document.getElementById('stockFoot');
  const recsEl = document.getElementById('recs');

  function openSheet(){
    paintSheet();
    scrim.classList.add('open'); sheet.classList.add('open');
    sheet.setAttribute('aria-hidden','false');
  }
  function closeSheet(){
    scrim.classList.remove('open'); sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden','true');
    render(); refreshToday();
  }
  stockBtn.addEventListener('click', openSheet);
  document.getElementById('closeStock').addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  function paintSheet(){
    const rows = Store.stockRows();
    let tTotal = 0, tSold = 0, tLeft = 0, hasTotal = false;

    stockBody.innerHTML = '';
    rows.forEach(r => {
      if (r.total !== null){ tTotal += r.total; tLeft += r.left; hasTotal = true; }
      tSold += r.sold;

      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="nm">' + r.nm + '<small>' + won(r.pr) + '원</small></td>' +
        '<td><input type="number" inputmode="numeric" min="0" step="1" data-total="' + r.id + '"' +
            ' value="' + (r.total === null ? '' : r.total) + '" placeholder="—" aria-label="' + r.nm + ' 총 재고"></td>' +
        '<td><input type="number" inputmode="numeric" min="0" step="1" data-sold="' + r.id + '"' +
            ' value="' + r.sold + '" aria-label="' + r.nm + ' 판매 수량"></td>' +
        '<td class="left-cell ' + (r.left === null ? 'none' : (r.left <= 3 ? 'low' : '')) + '">' +
            (r.left === null ? '—' : r.left) + '</td>';
      stockBody.appendChild(tr);
    });

    stockFoot.innerHTML =
      '<tr><td>합계</td>' +
      '<td>' + (hasTotal ? won(tTotal) : '—') + '</td>' +
      '<td>' + won(tSold) + '</td>' +
      '<td class="left-cell">' + (hasTotal ? won(tLeft) : '—') + '</td></tr>';

    const s = Store.allSummary();
    document.getElementById('sAmt').textContent = won(s.total);
    document.getElementById('sCnt').textContent = won(s.sales);
    document.getElementById('sPay').textContent = won(s.perPay.cash) + ' / ' + won(s.perPay.card);

    const recs = Store.all();
    recsEl.innerHTML = '';
    if (!recs.length){
      recsEl.innerHTML = '<div class="empty">아직 판매 기록이 없습니다.</div>';
      return;
    }
    recs.slice(0, 60).forEach(r => {
      const names = r.lines.map(l => ((CATALOG[l.id] || {}).nm || l.id) + (l.qty > 1 ? ' ×' + l.qty : '')).join(', ');
      const div = document.createElement('div');
      div.className = 'rec';
      div.innerHTML =
        '<span class="t">' + r.time + '</span>' +
        '<span class="ln">' + names + '</span>' +
        '<span class="pay' + (r.pay === 'cash' ? '' : ' nc') + '">' + Store.payLabel(r.pay) + '</span>' +
        '<span class="amt">' + won(Store.recTotal(r)) + '</span>' +
        '<button class="del" type="button" title="이 기록 지우기" aria-label="이 기록 지우기">&times;</button>';
      div.querySelector('.del').addEventListener('click', () => {
        if (!confirm(r.time + ' · ' + won(Store.recTotal(r)) + '원 기록을 지울까요?')) return;
        Store.remove(r.id);
        paintSheet(); render(); refreshToday();
        toast('기록을 지웠습니다');
      });
      recsEl.appendChild(div);
    });
  }

  function num(v){
    const t = String(v).trim();
    if (t === '') return null;
    const n = Math.round(Number(t));
    return isNaN(n) ? null : Math.max(0, n);
  }

  stockBody.addEventListener('change', e => {
    const el = e.target;
    if (el.hasAttribute('data-total')){
      Store.setStock(el.getAttribute('data-total'), { total: num(el.value) });
      paintSheet(); render();
    } else if (el.hasAttribute('data-sold')){
      const id = el.getAttribute('data-sold');
      const want = num(el.value);
      const auto = (Store.soldByPart()[id] || 0);
      Store.setStock(id, { adj: (want === null ? auto : want) - auto });
      paintSheet(); render();
    }
  });

  render();
  refreshToday();
  window.addEventListener('pageshow', () => { refreshToday(); render(); });
})();
</script>
</body>
</html>
